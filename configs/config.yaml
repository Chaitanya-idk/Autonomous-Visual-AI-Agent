# ============================================================
# SAGE Crop Disease — LoRA Fine-Tuning Configuration
# Primary environment: Kaggle GPU + Hugging Face Hub
# ============================================================

model:
  name_or_path: "/kaggle/input/models/qwen-lm/qwen2.5-vl/transformers/3b-instruct/2"
  local_files_only: true
  torch_dtype: "float16"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  hf_repo_id: "tirtho149/SAGE"

  # PRIMARY MODE:
  # Download only chunk_size shards to Kaggle disk, train the SAME model,
  # delete them, then download the next chunk.
  mode: "chunked"
  chunk_size: 2
  total_shards: 48
  chunk_dir: "/kaggle/working/data_cache"

  # Fixed non-overlapping split for 48 shards, chunk_size=2:
  # Train: shards 0-35 (18 chunks); validation: 36-41 (3 chunks);
  # final test: 42-47 (3 chunks). Test shards are used only after training.
  max_chunks_per_epoch: null


  # Used only to size the LR scheduler before chunks are downloaded.
  # The actual batch count is measured from every loaded chunk.
  estimated_rows_per_shard: 15900

  streaming: false
  parquet_dir: "/kaggle/working/data"

  image_col: "image"
  disease_col: "disease"
  crop_col: "crop"
  label_id_col: ""

  train_size: 3200
  val_size: 400
  val_split: 0.15
  seed: 42

preprocessing:
  min_pixels: 12544
  max_pixels: 25088

evaluation:
  # Evaluate every example in all 3 validation chunks after each epoch.
  # null means no batch cap; generation evaluation can take substantial time.
  val_max_batches: null
  # One-time evaluation across all 3 held-out test chunks after training.
  test_max_batches: null

training:
  seed: 42
  batch_size: 16
  gradient_accumulation_steps: 2
  num_workers: 4

  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  num_epochs: 3
  early_stopping_patience: 2

  gradient_checkpointing: false
  fp16: true
  bf16: false
  max_grad_norm: 1.0
  save_mode: "adapter"
  resume: true

paths:
  checkpoint_dir: "/kaggle/working/checkpoints_run3"
  output_dir: "/kaggle/working/outputs_run3"
  log_dir: "/kaggle/working/logs_run3"
  labels_json: "/kaggle/working/outputs_run3/labels.json"
