# ============================================================
# SAGE Crop Disease — LoRA Fine-Tuning Configuration
# Primary environment: Kaggle GPU + Hugging Face Hub
# ============================================================

model:
  name_or_path: "/kaggle/input/models/jaccojurg/qwen2-5-vl-3b/transformers/qwen2-5-vl-3b/1"
  local_files_only: true
  torch_dtype: "float16"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  hf_repo_id: "tirtho149/SAGE"

  # PRIMARY MODE:
  # Download only chunk_size shards to Kaggle disk, train the SAME model,
  # delete them, then download the next chunk.
  mode: "chunked"
  chunk_size: 2
  total_shards: 48
  chunk_dir: "/kaggle/working/data_cache"

  # IMPORTANT:
  # null/0 = process ALL training chunks in every epoch.
  # With 48 total shards and shard 47 reserved for validation:
  #   47 training shards -> 24 chunks at chunk_size=2.
  max_chunks_per_epoch: null

  # Used only to size the LR scheduler before chunks are downloaded.
  # The actual batch count is measured from every loaded chunk.
  estimated_rows_per_shard: 15900

  streaming: false
  parquet_dir: "/kaggle/working/data"

  image_col: "image"
  disease_col: "disease"
  crop_col: "crop"
  label_id_col: ""

  train_size: 3200
  val_size: 400
  val_split: 0.15
  seed: 42

preprocessing:
  min_pixels: 25088
  max_pixels: 50176

evaluation:
  # Fast per-epoch validation. Final evaluation can use the full shard.
  val_max_batches: 200

training:
  seed: 42
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  num_epochs: 3
  early_stopping_patience: 2

  gradient_checkpointing: true
  fp16: true
  bf16: false
  max_grad_norm: 1.0
  save_mode: "adapter"

paths:
  checkpoint_dir: "/kaggle/working/checkpoints"
  output_dir: "/kaggle/working/outputs"
  log_dir: "/kaggle/working/logs"
  labels_json: "/kaggle/working/labels.json"
