# SAGE Crop Disease — Fresh split-aware LoRA fine-tuning run
# IMPORTANT: this starts from the base model; it does NOT resume the old adapter.

model:
  name_or_path: "/kaggle/input/models/qwen-lm/qwen2.5-vl/transformers/3b-instruct/2"
  local_files_only: true
  torch_dtype: "float16"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  hf_repo_id: "tirtho149/SAGE"
  mode: "chunked"
  chunk_size: 2
  total_shards: 48
  chunk_dir: "/kaggle/working/data_cache_run2"

  # Fixed shard-level split, chosen with seed 42 from shards 0-46.
  # Validation is used for per-epoch monitoring; test shards are never
  # downloaded by train.py and must only be evaluated after training ends.
  validation_shards: [10]
  test_shards: [21, 23, 24, 29]
  max_chunks_per_epoch: null
  estimated_rows_per_shard: 15900

  streaming: false
  parquet_dir: "/kaggle/working/data"
  image_col: "image"
  disease_col: "disease"
  crop_col: "crop"
  label_id_col: ""
  train_size: 3200
  val_size: 400
  val_split: 0.15
  seed: 42

preprocessing:
  min_pixels: 12544
  max_pixels: 25088

evaluation:
  # Training-time diagnostic only. The final held-out test is evaluated
  # separately across all examples in the four test shards.
  val_max_batches: null

training:
  seed: 42
  batch_size: 16
  gradient_accumulation_steps: 2
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  num_epochs: 3
  early_stopping_patience: 2
  gradient_checkpointing: false
  fp16: true
  bf16: false
  max_grad_norm: 1.0
  save_mode: "adapter"
  resume: false
  resume_checkpoint: "latest_checkpoint"

paths:
  checkpoint_dir: "/kaggle/working/checkpoints_run2"
  output_dir: "/kaggle/working/outputs_run2"
  log_dir: "/kaggle/working/logs_run2"
  labels_json: "/kaggle/working/outputs/labels.json"
