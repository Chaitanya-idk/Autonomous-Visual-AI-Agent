# ============================================================
# SAGE Crop Disease — LoRA Fine-Tuning Configuration
# Model: Qwen2.5-VL-3B-Instruct (full precision, no quantization)
# Target: Kaggle (T4/P100/A100) | GCP (L4/A100)
# ============================================================

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # Option A: Kaggle model hub (add the model via Kaggle UI)
  #   name_or_path: "/kaggle/input/models/jaccojurg/qwen2-5-vl-3b/transformers/qwen2-5-vl-3b/1"
  #   local_files_only: true
  #
  # Option B: HuggingFace Hub (needs internet ON in Kaggle settings)
  #   name_or_path: "Qwen/Qwen2.5-VL-3B-Instruct"
  #   local_files_only: false
  name_or_path: "/kaggle/input/models/jaccojurg/qwen2-5-vl-3b/transformers/qwen2-5-vl-3b/1"
  local_files_only: true
  # bfloat16: A100/L4/H100 (best quality)
  # float16:  T4/P100 (older GPUs, use this if bf16 throws errors)
  torch_dtype: "bfloat16"

# ── LoRA Adapter ──────────────────────────────────────────────────────────────
lora:
  r: 32             # Rank (16–64); higher = more capacity + more VRAM
  lora_alpha: 64    # Usually 2x rank
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  hf_repo_id: "tirtho149/SAGE"   # HuggingFace dataset ID

  # STREAMING MODE (recommended for 21GB dataset — zero download wait)
  # Reads data directly from HuggingFace Hub over the network.
  # Requires: Internet ON in Kaggle settings.
  streaming: true

  # ── Column names — verify with: df.columns.tolist() on one parquet file ──
  image_col: "image"       # PIL image or {"bytes": b"..."} dict
  disease_col: "disease"   # Disease name string (target label)
  crop_col: "crop"         # Crop type (set "" to disable)
  label_id_col: ""         # Integer label id (set "" if not in dataset)

  # ── Streaming split sizes (number of samples, not ratios) ─────────────────
  # Total SAGE dataset has ~100K-1M images; adjust to your GPU time budget.
  # Kaggle free tier: ~9 hours — aim for ~50K–100K training samples.
  train_size: 50000   # Number of streaming samples used for training per epoch
  val_size: 5000      # Number of streaming samples used for validation
  seed: 42

# ── Preprocessing / Vision Resolution ────────────────────────────────────────
preprocessing:
  # Higher = more image detail but more VRAM.
  # T4 (16GB):   min=100352 / max=200704  (128–256 tokens, safe)
  # L4 (24GB):   min=200704 / max=401408  (256–512 tokens)
  # A100 (40GB): min=401408 / max=802816  (512–1024 tokens)
  min_pixels: 100352
  max_pixels: 200704

# ── Training ──────────────────────────────────────────────────────────────────
training:
  seed: 42

  # T4 16GB → batch 2–4 | L4 24GB → batch 4–8 | A100 → batch 8–16
  batch_size: 2

  # Effective batch = batch_size × gradient_accumulation_steps (aim for ≥32)
  gradient_accumulation_steps: 16

  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  num_epochs: 10
  early_stopping_patience: 7

  gradient_checkpointing: true
  fp16: false   # true for T4/P100 (float16)
  bf16: true    # true for A100/L4 (bfloat16); set false if using fp16
  max_grad_norm: 1.0

  # "adapter" = small ~50MB, needs PEFT at inference
  # "merged"  = full 7GB model, self-contained
  save_mode: "adapter"

# ── Output Paths ─────────────────────────────────────────────────────────────
paths:
  # On Kaggle: use /kaggle/working/ so outputs are saved as notebook artifacts
  checkpoint_dir: "/kaggle/working/checkpoints"
  output_dir:     "/kaggle/working/outputs"
  log_dir:        "/kaggle/working/logs"
  labels_json:    "/kaggle/working/labels.json"
  # On GCP / local: use relative paths
  # checkpoint_dir: "checkpoints"
  # output_dir:     "outputs"
  # log_dir:        "logs"
  # labels_json:    "data/labels.json"
