# ============================================================
# SAGE Crop Disease — LoRA Fine-Tuning Configuration
# Model: Qwen2.5-VL-3B-Instruct (full precision, no quantization)
# Target: Kaggle (T4/P100/A100) | GCP (L4/A100)
# ============================================================

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name_or_path: "/kaggle/input/models/jaccojurg/qwen2-5-vl-3b/transformers/qwen2-5-vl-3b/1"
  local_files_only: true
  # float16: hardware accelerated on T4/P100 Tensor Cores
  # bfloat16: for A100/L4/H100
  torch_dtype: "float16"

# ── LoRA Adapter ──────────────────────────────────────────────────────────────
lora:
  r: 32             # Rank (16–64); higher = more capacity + more VRAM
  lora_alpha: 64    # Usually 2x rank
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  hf_repo_id: "tirtho149/SAGE"   # HuggingFace dataset ID

  # ── DATA ACCESS MODE ──
  # - "chunked": Rolling window: downloads 2 parquet files (~850MB),
  #              trains with fast local I/O, immediately deletes them to free disk.
  #              Peak disk usage stays < 1.3 GB!
  mode: "chunked"
  chunk_size: 2               # number of parquet files per chunk (keeps disk < 1.3 GB)
  total_shards: 48            # 48 shards in SAGE dataset (train-00000 to train-00047)
  chunk_dir: "/kaggle/working/data_cache"
  max_chunks_per_epoch: 1     # Keep 1 chunk/epoch for the current Kaggle run.
  estimated_rows_per_shard: 15900  # Scheduler estimate; actual batch count is measured after download.

  # Fallback paths for local or streaming modes:
  streaming: false
  parquet_dir: "/kaggle/working/data"

  # ── Column names ──
  image_col: "image"       # PIL image or {"bytes": b"..."} dict
  disease_col: "disease"   # Disease name string (target label)
  crop_col: "crop"         # Crop type (set "" to disable)
  label_id_col: ""         # Integer label id (set "" if not in dataset)

  # ── Dataset sizes (for streaming / local split fallback) ──
  train_size: 3200
  val_size: 400
  val_split: 0.15
  seed: 42

# ── Preprocessing / Vision Resolution ────────────────────────────────────────
preprocessing:
  # 25088 - 50176 gives ~64 visual tokens (2-3x faster attention than 256 tokens)
  min_pixels: 25088
  max_pixels: 50176

# ── Training ──────────────────────────────────────────────────────────────────
training:
  seed: 42

  # batch_size 4 utilizes GPU 0 memory well (~12-14 GB out of 16 GB)
  batch_size: 4

  # Effective batch = 4 * 8 = 32
  gradient_accumulation_steps: 8

  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  num_epochs: 3
  early_stopping_patience: 2
  validation_max_batches: 200  # Fast per-epoch sanity check; final evaluation uses the full validation shard.

  gradient_checkpointing: true
  fp16: true    # native hardware acceleration on T4 Tensor Cores
  bf16: false   # false on T4 (T4 does not have native bf16 Tensor Cores)
  max_grad_norm: 1.0

  # "adapter" = small LoRA weights; the training checkpoints also include optimizer/scheduler state.
  # "merged"  = full 7GB model, self-contained
  save_mode: "adapter"

# ── Output Paths ─────────────────────────────────────────────────────────────
paths:
  # On Kaggle: use /kaggle/working/ so outputs are saved as notebook artifacts
  checkpoint_dir: "/kaggle/working/checkpoints"
  output_dir:     "/kaggle/working/outputs"
  log_dir:        "/kaggle/working/logs"
  labels_json:    "/kaggle/working/labels.json"
  # On GCP / local: use relative paths
  # checkpoint_dir: "checkpoints"
  # output_dir:     "outputs"
  # log_dir:        "logs"
  # labels_json:    "data/labels.json"
